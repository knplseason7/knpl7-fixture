<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNPL-7 Fixture Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--maroon:#3B0F1A;--maroon2:#5a1a2a;--gold:#F2B544;--gold2:#D9A441;--cream:#FFF4DC;--paper:#FFFBF2;--teal:#1F6B66;--ink:#231a1d;--mute:#6f6366;--line:#eadfc8;--red:#b3202a;--green:#1c7a4a;--amber:#b7791f;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Poppins,system-ui,Segoe UI,Arial,sans-serif;background:#f6efe0;color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.top{background:linear-gradient(135deg,#2b0b17,#3B0F1A 60%,#4a1424);color:var(--cream);position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.top-in{max-width:1240px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--gold);object-fit:contain;flex:none}
.brand b{font-family:Cinzel,serif;font-size:16px;color:var(--gold);letter-spacing:.5px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:#e6d6b4;letter-spacing:1.5px}
.who{margin-left:auto;font-size:12px;color:#e6d6b4;display:flex;gap:10px;align-items:center}
.tabs{max-width:1240px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:#e6d6b4;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.tab.on{background:var(--gold);color:var(--maroon);font-weight:600}
main{max-width:1240px;margin:auto;padding:18px 16px 70px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card h2{font-size:16px;color:var(--maroon);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:14px;color:var(--maroon);margin:12px 0 6px}
.muted{color:var(--mute)} .small{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--maroon);color:var(--cream);font-size:13px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--maroon2)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--maroon)} .btn.gold:hover{background:#ffc766}
.btn.ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon)} .btn.ghost:hover{background:#f3e8d0}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.red{background:var(--red)}
input,select,textarea{border:1.5px solid #d9ccb0;border-radius:9px;padding:8px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold2)}
label{font-size:12px;font-weight:600;color:var(--maroon);display:block;margin-bottom:3px}
.field{margin-bottom:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#eee;color:#555;white-space:nowrap}
.chip.planned{background:#fbefd0;color:#7a5200}.chip.created{background:#dcebf7;color:#1b4a7a}.chip.done{background:#dcefe3;color:#14613a}.chip.lock{background:#eee;color:#777}.chip.ready{background:var(--gold);color:var(--maroon)}
.crest{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:10px;border:2px solid var(--gold);flex:none;overflow:hidden;background:#fff}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.big{width:56px;height:56px;font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--maroon);color:var(--cream);font-weight:500;text-align:left;padding:7px 9px;font-size:12px;white-space:nowrap}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.q td{background:#e8f4ec}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;flex-wrap:wrap}
.stage .t{flex:1;min-width:180px;font-weight:600}.stage .t small{display:block;font-weight:400;color:var(--mute)}
.warn{background:#fff4d6;border:1px solid #f0cf7a;color:#7a5200;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.note{background:#eaf3f2;border:1px solid #b8d6d2;color:#134b47;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.err{background:#fde8e8;border:1px solid #f1b4b4;color:#8a1c1c;border-radius:10px;padding:8px 12px;margin-bottom:8px}
.slot{display:grid;grid-template-columns:92px 1fr 1fr;gap:10px;margin-bottom:10px;align-items:stretch}
.slot .tm{font-weight:700;color:var(--maroon);padding-top:10px;font-size:13px}
.slot .tm small{display:block;color:var(--mute);font-weight:500}
@media(max-width:820px){.slot{grid-template-columns:1fr}.slot .tm{padding-top:0}.slot .tm small{display:inline;margin-left:6px}}
.mc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:10px 12px}
.mc.g1{border-left-color:var(--teal)} .mc.done{background:#f4fbf6}
.mc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.mc-top .no{font-weight:700;color:var(--maroon)}
.gtag{background:var(--maroon);color:var(--cream);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}.gtag.g1{background:var(--teal)}
.mc-teams{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.mc-teams .vs{color:var(--gold2);font-weight:700;font-size:12px}
.mc-teams b{font-weight:600;font-size:13px}
.mc-meta{font-size:12px;color:var(--mute)} .trav{color:#9a4b00;font-weight:600}
.mc-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.daytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dt{border:1.5px solid var(--maroon);background:transparent;color:var(--maroon);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:13px}
.dt.on{background:var(--maroon);color:var(--cream)}
.modal-bg{position:fixed;inset:0;background:rgba(20,5,10,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.modal{background:var(--paper);border-radius:16px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h2{color:var(--maroon);font-size:17px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--maroon);color:var(--cream);padding:10px 18px;border-radius:12px;z-index:80;font-weight:500;max-width:90vw;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.toast.err{background:var(--red)}
.wheelbox{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:18px;align-items:start}
@media(max-width:820px){.wheelbox{grid-template-columns:1fr}}
#wheel{width:100%;max-width:440px;height:auto;display:block;margin:auto}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks ol{margin:0;padding:0;list-style:none}
.picks li{display:flex;gap:8px;align-items:center;padding:5px 8px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:5px;font-size:12.5px;min-height:40px}
.picks li.empty{opacity:.35}
.picks h3{margin:0 0 6px}
.login{max-width:420px;margin:50px auto}
.thumbwrap canvas{width:100%;height:auto;border-radius:12px;border:2px solid var(--gold);display:block;background:#222}
.pub{max-width:760px;margin:auto}
.step{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--maroon);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.gbtn{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;margin-bottom:10px;font-size:15px}
.gbtn:hover,.gbtn.on{border-color:var(--gold2);background:#fff7e4}
.mrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.mrow.on{border-color:var(--gold2);background:#fff7e4}.mrow.off{opacity:.5;cursor:not-allowed}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px}
.side{display:inline-flex;align-items:center;gap:6px;padding:2px 6px 2px 2px;border-radius:999px;border:1.5px solid transparent}
.tvteam{background:#fde8e8;border-color:var(--red);color:#8a1c1c}
.tvb{background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;letter-spacing:.5px}
.mc.hastravel{box-shadow:0 0 0 1px #f1b4b4}
.trline{background:#fde8e8;border-radius:8px;padding:4px 8px;margin-top:6px;color:#8a1c1c;font-size:12px;font-weight:600}
.banner{background:#fff4d6;border:1px solid #f0cf7a;color:#7a5200;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.banner.ok{background:#e8f4ec;border-color:#b6dcc3;color:#14613a}
@media(max-width:560px){.brand small{display:none}.brand b{font-size:13px;white-space:normal}.who{font-size:11px}.top-in{gap:6px}}

.hero{background:linear-gradient(135deg,#2b0b17,#3B0F1A 60%,#5a1a2a);color:var(--cream);border-radius:18px;padding:26px 20px;margin-bottom:16px;text-align:center}
.hero h1{font-family:Cinzel,serif;color:var(--gold);font-size:28px;margin-bottom:6px}.hero p{margin:6px auto;max-width:560px;color:#eadcc0}
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.facts span{background:rgba(242,181,68,.15);border:1px solid rgba(242,181,68,.4);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--gold)}
.bigcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}@media(max-width:820px){.bigcards{grid-template-columns:1fr}}
.bigcard{display:block;text-decoration:none;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:18px;transition:.15s}.bigcard:hover{border-color:var(--gold2);transform:translateY(-2px)}
.bigcard .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--maroon);font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.bigcard h3{color:var(--maroon);font-size:17px;margin-bottom:4px}.bigcard p{margin:0;color:var(--mute);font-size:13px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.sec h2{color:var(--maroon);font-size:18px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.sec h2 .n{width:28px;height:28px;border-radius:50%;background:var(--maroon);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.sec p{margin:6px 0}.tl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}.tl .st{background:var(--maroon);color:var(--cream);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600}.tl .ar{color:var(--gold2);font-weight:700}
.ladder{display:grid;grid-template-columns:1fr;gap:4px;max-width:420px;margin:10px 0}.rung{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}.rung b{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--maroon);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}.rung.low b{background:#cfd8d7}.rung .pr{margin-left:auto;font-size:11px;color:var(--teal);font-weight:600}
.pairbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.pairbox{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:13px}.opt b{color:var(--maroon)}.opt.no{opacity:.6}
.prog{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}.prog::-webkit-scrollbar{display:none}.prog span{flex:none;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;background:#eee;color:#777}.prog span.done{background:#dcefe3;color:#14613a}.prog span.cur{background:var(--gold);color:var(--maroon)}
.coach{border:2px solid var(--gold2);background:#fff9e8}.coach h2{margin-bottom:4px}
.fabbar{position:fixed;left:0;right:0;bottom:0;background:#3B0F1A;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.25)}.fabbar .btn{font-size:15px;padding:12px 22px;flex:1;max-width:520px}.fabbar small{color:#e6d6b4;font-size:11px;display:none}
.mc.mine{outline:3px solid var(--gold);outline-offset:1px}
details.more{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}details.more summary{cursor:pointer;font-weight:600;color:var(--maroon)}
.champ{background:linear-gradient(135deg,#F2B544,#ffd98a);color:var(--maroon);text-align:center;border-radius:16px;padding:18px;margin-bottom:14px;font-family:Cinzel,serif;font-size:22px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.crumbs a{text-decoration:none;font-size:12px;font-weight:600;color:var(--maroon);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
@media(max-width:560px){.hero h1{font-size:22px}}
@media print{.top,.noprint,.toast{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}

/* ---- simple game-style simulation ---- */
.game{max-width:1040px;padding-bottom:84px}
.btn.big{font-size:16px;padding:13px 26px}
.card.top select{width:100%;margin-top:4px}
.tabs2{display:flex;gap:6px;margin:6px 0 12px;background:#efe4cb;border-radius:12px;padding:4px}
.t2{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--maroon);cursor:pointer}
.t2.on{background:var(--maroon);color:var(--cream)}
.legend{margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fxwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.fx{display:grid;grid-template-columns:54px 80px 130px 96px minmax(0,1fr) minmax(170px,230px) 34px;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);border-left:5px solid transparent;font-size:13.5px}
.fx.head{background:var(--maroon);color:var(--cream);font-weight:600;font-size:12px;border-left-color:var(--maroon)}
.fx.first:not(.head){border-top:2px solid #d9c9a3}
.fx .no{font-weight:700;color:var(--maroon)} .fx .time{font-weight:700}
.fx.blank{background:#faf6ea;color:#8a7f7a}
.fx.live{background:#fff4d2;border-left-color:var(--gold2)}
.fx.done{background:#e8f5ec;border-left-color:var(--green)}
.fx.mine{background:#ece3fb;border-left-color:#6b3fb0}
.fx.mine.done{background:#dcefe3;box-shadow:inset 0 0 0 2px #6b3fb0}
.fx .tms{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tm2{display:inline-flex;align-items:center;gap:6px}.tm2 b{font-weight:600}.vs2{color:var(--gold2);font-weight:800;font-size:12px}
.tm2.empty{color:#b9ad9a}
.tm2.win b{color:var(--green)} .tm2.win i{font-style:normal;background:var(--green);color:#fff;border-radius:6px;padding:0 6px;font-size:10px;font-weight:700}
.tm2.lose{opacity:.5}
.tm2.me b{color:#5b2fa0}
.trv{display:inline-block;background:#fde6e6;color:var(--red);border:1px solid #f1b4b4;border-radius:8px;padding:2px 8px;font-size:12.5px;margin:1px 0}.trv small{color:#7a1b1b}
.trv.me{background:var(--red);color:#fff;border-color:var(--red)}.trv.me small{color:#ffe0e0}
.ico{border:0;background:transparent;cursor:pointer;font-size:16px;padding:2px}
.mystrip{display:flex;gap:12px;align-items:center;background:#ece3fb;border:2px solid #6b3fb0;border-radius:14px;padding:10px 14px;margin-bottom:12px}
.news{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold2);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
.resl .rs{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 6px;border-bottom:1px solid var(--line)}.resl .rs:last-child{border:0}.resl .rs.mine{background:#ece3fb;border-radius:10px;padding:9px 10px}
.resl .rs-t{font-size:14px}
.ladders{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.ladders{grid-template-columns:1fr}}
.tbl tr.me td{background:#ece3fb;font-weight:600}
.mv{font-size:11px;font-weight:700;width:34px}.mv.up{color:var(--green)}.mv.dn{color:var(--red)}
@media(max-width:760px){
 .fx.head{display:none}
 .fx{grid-template-columns:auto auto 1fr auto;grid-template-areas:"no time gr act" "rd rd rd rd" "tms tms tms tms" "tv tv tv tv";gap:4px 10px;padding:10px 12px}
 .fx .no{grid-area:no}.fx .time{grid-area:time}.fx .gr{grid-area:gr}.fx .rd{grid-area:rd;font-size:12px;color:var(--mute)}.fx .tms{grid-area:tms}.fx .tv{grid-area:tv}.fx .act{grid-area:act}
 .fx.notrv .tv{display:none}
 .t2{font-size:13px}
}
select{color:var(--ink);background:#fff}.topbar select{flex:1;min-width:0}
.fx .tms{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.tm2.win i{width:18px;height:18px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px}
.daytabs{flex-wrap:nowrap}.daytabs .dt{flex:1;padding:7px 4px;font-size:12px;white-space:nowrap}
.fx{grid-template-columns:54px 76px 120px 96px minmax(0,1fr) minmax(160px,210px) 30px}
@media(max-width:760px){.fx .tms{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}}
@media(max-width:760px){.fx .tms{grid-template-columns:1fr;gap:3px}.fx .vs2{display:none}.tm2 b{font-size:14px}}
/* ---- match cards ---- */
.lvls{display:flex;flex-direction:column;gap:6px}
.lvl{margin-bottom:10px}
.lvl-h{display:flex;align-items:center;gap:10px;font-family:Cinzel,serif;color:var(--maroon);font-size:16px;margin:12px 2px 8px}
.slotg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:760px){.slotg{grid-template-columns:1fr;gap:10px}}
.mcx{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px 12px;position:relative}
.mcx .mh{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}.mcx .mh .n{font-weight:800;color:var(--maroon)}.mcx .mh .rdl{color:var(--mute);flex:1}
.vsr{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px}
.tb{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;position:relative;padding:6px 2px;border-radius:12px}
.tb b{font-size:13.5px;font-weight:700;line-height:1.2}
